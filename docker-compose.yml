services:

  # 3. BullMQ Background Worker + FFmpeg (Locked to 1 vCPU Max)
  worker:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: lms_worker
    command: ["node", "src/workers/transcode.worker.js"]
    env_file: .env
    volumes:
      - video_tmp:/tmp/uploads
      - ./backend/src:/app/src
    depends_on:
      - mongo
      - redis
      - minio 
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2.5G
    networks:
      - lms_internal
    restart: unless-stopped
   
  # ---- MongoDB: self-hosted, private to the docker network only ----
  mongo:
    image: mongo:7
    container_name: lms_mongo
    command: mongod --wiredTigerCacheSizeGB 1
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ma-creation
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks: 
      - lms_internal
    restart: unless-stopped

  # 5. Redis for BullMQ
  redis: 
    image: redis:alpine
    container_name: lms_redis
    command: redis-server --requirepass ${REDIS_PASS} --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    networks:
      - lms_internal
    restart: unless-stopped
        
  # ---- MinIO: object storage for video files ----
  minio:
    image: minio/minio:latest
    container_name: lms_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks: 
      - lms_internal
    restart: unless-stopped

  # ---- Node/Express backend (this project's API) ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lms_backend
    command: node src/server.js 
    env_file: .env
    volumes:
      - video_tmp:/tmp/uploads 
      - ./backend/src:/app/src
    depends_on: 
      - mongo
      - redis
      - minio
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    networks: 
      - lms_internal
    restart: unless-stopped

  # frontend:
  #   build:
  #     context: ./frontend
  #     dockerfile: Dockerfile
  #   restart: unless-stopped
  #   networks: [internal]

  

  # ---- Caddy: automatic HTTPS reverse proxy, the ONLY container exposed to the internet ----
  caddy:
    image: caddy:2
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      CDN_DOMAIN: ${CDN_DOMAIN}
    depends_on: [backend, minio]  #, frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: 
      - lms_internal
    restart: unless-stopped

volumes:
  video_tmp:
  mongo_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:

networks:
  lms_internal:
    driver: bridge
